services:
  - type: web
    name: trace-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: PORT
        value: "8000"
      - key: DATA_DIR
        value: /tmp/trace_uploads
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
